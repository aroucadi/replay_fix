[package]
name = "replayfix-cli"
version = "0.2.1"
edition = "2021"
authors = ["ReplayFix Contributors"]
description = "Deterministic CLI verification harness for ReplayFix"
license = "MIT"

[[bin]]
name = "replayfix"
path = "src/main.rs"
test = false

[dependencies]
replayfix-core = { path = "../replayfix-core" }
tokio = { version = "1.43", features = ["rt-multi-thread", "macros"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
