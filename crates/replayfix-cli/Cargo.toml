[package]
name = "replayfix-cli"
version = "1.1.0"
edition = "2021"
authors = ["ReplayFix Contributors"]
description = "ReplayFix CLI — Deterministic verification and repair harness"
license = "MIT"

[[bin]]
name = "replayfix"
path = "src/main.rs"
test = false

[dependencies]
replayfix-core = { path = "../replayfix-core", version = "1.1.0" }
tokio = { version = "1.43", features = ["rt-multi-thread", "macros"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
temp-env = "0.3"

[lints]
workspace = true
