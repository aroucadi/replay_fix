[package]
name = "replayfix-cli"
version = "0.1.1"
edition = "2021"
authors = ["ReplayFix Contributors"]
description = "Deterministic CLI verification harness for ReplayFix"
license = "MIT"

[[bin]]
name = "replayfix"
path = "src/main.rs"

[dependencies]
replayfix-core = { path = "../replayfix-core" }
tokio = { version = "1.43", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
