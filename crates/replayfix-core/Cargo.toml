[package]
name = "replayfix-core"
version = "0.1.1"
edition = "2021"
authors = ["ReplayFix Contributors"]
description = "Core verification harness, state machine, platform abstractions, and perception engine for ReplayFix"
license = "MIT"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.43", features = ["full"] }
tracing = "0.1"
regex = "1.11"
walkdir = "2.5"
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
