[package]
name = "replayfix-core"
version = "0.9.5"
edition = "2021"
authors = ["ReplayFix Contributors"]
description = "Core verification harness, state machine, platform abstractions, and perception engine for ReplayFix"
license = "MIT"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
regex = "1.11"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
ed25519-dalek = { version = "2.1", features = ["fast", "zeroize", "rand_core"] }
rand_core = { version = "0.6", features = ["std", "getrandom"] }

[lints]
workspace = true
