name: 'ReplayFix Autonomous Verification, Inoculation & Issue Triage Bot'
description: 'Deterministic Rust harness for visual bug reproduction, causal verification, permanent inoculation, autonomous GitHub issue triage, and cryptographic audit reporting'
author: 'ReplayFix Contributors'

inputs:
  issue-url:
    description: 'GitHub issue URL to autonomously triage (e.g. https://github.com/org/repo/issues/123). When provided, runs `replayfix bot` mode.'
    required: false
    default: ''
  bug:
    description: 'Bug identifier to reproduce and verify (e.g. RF-01)'
    required: false
    default: 'RF-01'
  repo:
    description: 'Target repository path to verify'
    required: false
    default: '.'
  output-dir:
    description: 'Output directory for receipts, SARIF, and triage reports'
    required: false
    default: '.replayfix'
  stress-quorum:
    description: 'Run Gate 3 3-pass concurrency & network perturbation quorum'
    required: false
    default: 'true'
  inoculate:
    description: 'Synthesize permanent Playwright regression test into tests/repro'
    required: false
    default: 'true'
  create-pr:
    description: 'Automatically dispatch pull request upon verified fix'
    required: false
    default: 'true'
  comment-issue:
    description: 'Post structured Evidence Matrix comment to issue thread'
    required: false
    default: 'true'
  apply-labels:
    description: 'Automatically apply triage labels to issue'
    required: false
    default: 'true'
  sarif:
    description: 'Export SARIF v2.1.0 report for GitHub Code Scanning'
    required: false
    default: 'true'
  junit:
    description: 'Export JUnit XML report for test results'
    required: false
    default: 'true'

runs:
  using: 'composite'
  steps:
    - name: Run ReplayFix Autonomous Engine
      shell: bash
      run: |
        if [ -n "${{ inputs.issue-url }}" ]; then
          ARGS=(bot --issue "${{ inputs.issue-url }}" --repo "${{ inputs.repo }}" --output "${{ inputs.output-dir }}")
          if [ "${{ inputs.create-pr }}" = "true" ]; then
            ARGS+=(--create-pr)
          fi
          if [ "${{ inputs.comment-issue }}" = "true" ]; then
            ARGS+=(--comment-issue)
          fi
          if [ "${{ inputs.apply-labels }}" = "true" ]; then
            ARGS+=(--apply-labels)
          fi
          cargo run --release -p replayfix-cli -- "${ARGS[@]}"
        else
          ARGS=(repro --bug "${{ inputs.bug }}" --repo "${{ inputs.repo }}" --output-dir "${{ inputs.output-dir }}")
          if [ "${{ inputs.stress-quorum }}" = "true" ]; then
            ARGS+=(--stress-quorum)
          fi
          if [ "${{ inputs.inoculate }}" = "true" ]; then
            ARGS+=(--inoculate)
          fi
          if [ "${{ inputs.sarif }}" = "true" ]; then
            ARGS+=(--sarif "${{ inputs.output-dir }}/results.sarif")
          fi
          if [ "${{ inputs.junit }}" = "true" ]; then
            ARGS+=(--junit "${{ inputs.output-dir }}/junit.xml")
          fi
          cargo run --release -p replayfix-cli -- "${ARGS[@]}"
        fi
